---
workload:
  application-class-id: "045c591e-2251-4039-b9f8-3617a139f49b"
  spec: nginx-deployment.yaml
  manufacturer: Opaque Systems
  application-id: nginx-demo
  name: Nginx Dogfooding
  # Replace with the CLASS ID of your own platform's Active manifest:
  # `opaque oas manifests`, the row where LAYER=Platform, STATUS=Active,
  # and TEE matches your cloud (TDX on GCP, SEV-SNP on Azure). The value
  # this used to hardcode was a GCP debug-image manifest that's Revoked
  # on a fresh install.
  platform-class-id: "<YOUR-PLATFORM-CLASS-ID>"
  version: "0.0.1"

policy:
  runtime: standard
  lock-digests: true

mesh:
  enable: false

logging:
  format: json
